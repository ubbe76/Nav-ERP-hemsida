name: Bygg och publicera

on:
  push:
    branches: [main]
  # Nightly: picks up manual and screenshot changes from Nav-ERP.
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      indexnow: ${{ steps.indexnow.outputs.body }}
    env:
      NAV_ERP_DIR: ${{ github.workspace }}/.nav-erp
    steps:
      # Full history in both checkouts: the sitemap's lastmod and the manual's
      # "uppdaterad" date come from git, and a shallow clone has no dates to give.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      # The ERP repo holds the manual, screenshots and tokens. NAV_ERP_SECRET
      # (a read-only fine-grained token) is only needed while it is private.
      - uses: actions/checkout@v4
        with:
          repository: ubbe76/Nav-ERP
          path: .nav-erp
          fetch-depth: 0
          token: ${{ secrets.NAV_ERP_SECRET || github.token }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # e2e runs against a build at the root path (the test server serves out/ at /).
      # GITHUB_TOKEN only where the build reads stars/release from the GitHub API —
      # not job-wide, where npm ci's third-party install scripts could read it.
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # The published build: origin + base path from GitHub Pages. postbuild
      # re-runs the link check with BASE_PATH, so every link carries the prefix.
      - run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.origin }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          GITHUB_TOKEN: ${{ github.token }}

      # Pages whose lastmod differs from the sitemap still live, for IndexNow
      # once this build is deployed (the deploy job sends them).
      - id: indexnow
        run: npx tsx scripts/indexnow.ts out/sitemap.xml "$SITE" >> "$GITHUB_OUTPUT"
        env:
          SITE: ${{ steps.pages.outputs.base_url }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Now that the pages are live: tell Bing and the other IndexNow engines.
      # A failed submission is shown as a warning — it's no reason to fail a
      # finished deploy, and the engines still find the pages via the sitemap.
      - if: needs.build.outputs.indexnow != ''
        continue-on-error: true
        env:
          BODY: ${{ needs.build.outputs.indexnow }}
        run: >-
          curl --fail-with-body -sS -X POST https://api.indexnow.org/indexnow
          -H "Content-Type: application/json; charset=utf-8" --data "$BODY"
